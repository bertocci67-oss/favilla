plugins {
    id 'com.android.application'
}

// CI generates a throwaway keystore (see .github/workflows/apk.yml) and points these
// variables at it. Without them the build still runs, but produces an unsigned APK that
// Android refuses to install.
def keystorePath = System.getenv('FAVILLA_KEYSTORE')
def hasKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace 'app.favilla'
    compileSdk 34

    defaultConfig {
        applicationId 'app.favilla'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('FAVILLA_STORE_PASS')
                keyAlias System.getenv('FAVILLA_KEY_ALIAS')
                keyPassword System.getenv('FAVILLA_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
